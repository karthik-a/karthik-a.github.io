<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1f1f24;
    --muted: #8a8a93;
    --line: #ebe9e4;
    --accent: #2fb67c;
    --accent-soft: #e2f6ec;
    --flame: #ff8a3d;
    --danger: #e5484d;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141417;
      --card: #1d1d22;
      --text: #ececf1;
      --muted: #8d8d98;
      --line: #2b2b32;
      --accent-soft: #1b3a2c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141417;
    --card: #1d1d22;
    --text: #ececf1;
    --muted: #8d8d98;
    --line: #2b2b32;
    --accent-soft: #1b3a2c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-block: 40px 80px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  .date { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .ring { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .track { stroke: var(--line); }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.22,1,.36,1); }
  .ring-label { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 600; }

  /* Add form */
  .add {
    display: flex; gap: 8px; background: var(--card); padding: 8px;
    border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px;
  }
  .emoji-btn {
    width: 44px; height: 44px; border-radius: 12px; font-size: 22px;
    background: var(--bg); flex-shrink: 0; transition: transform .15s;
  }
  .emoji-btn:hover { transform: scale(1.06); }
  .add input {
    flex: 1; min-width: 0; border: none; background: transparent; color: var(--text);
    font: inherit; font-size: 16px; padding: 0 8px; outline: none;
  }
  .add input::placeholder { color: var(--muted); }
  .add-submit {
    background: var(--text); color: var(--bg); border-radius: 12px;
    padding: 0 18px; font-weight: 600; font-size: 15px; transition: opacity .15s, transform .1s;
  }
  .add-submit:active { transform: scale(.96); }
  .add-submit:disabled { opacity: .35; cursor: default; }

  .picker {
    display: none; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px;
    background: var(--card); padding: 10px; border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 12px;
  }
  .picker.open { display: grid; animation: drop .2s ease-out; }
  .picker button { font-size: 22px; height: 40px; border-radius: 10px; transition: background .15s, transform .15s; }
  .picker button:hover { background: var(--bg); transform: scale(1.12); }
  .picker .custom {
    grid-column: 1 / -1; display: flex; gap: 8px; align-items: center;
    padding-top: 8px; margin-top: 4px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
  }
  .picker .custom input {
    width: 64px; font-size: 20px; text-align: center; padding: 4px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  @keyframes drop { from { opacity: 0; transform: translateY(-6px); } }

  /* Week nav */
  .week-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin: 28px 4px 10px; font-size: 13px; color: var(--muted);
  }
  .week-nav .label { font-weight: 600; color: var(--text); }
  .week-nav button { width: 30px; height: 30px; border-radius: 8px; font-size: 16px; color: var(--muted); }
  .week-nav button:hover:not(:disabled) { background: var(--card); color: var(--text); }
  .week-nav button:disabled { opacity: .3; cursor: default; }

  /* Habit cards */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .habit {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px; position: relative; overflow: hidden;
    animation: enter .35s cubic-bezier(.22,1,.36,1);
    transition: transform .3s, opacity .3s;
  }
  .habit.removing { transform: translateX(40px); opacity: 0; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px) scale(.98); } }

  .habit-top { display: flex; align-items: center; gap: 12px; }
  .habit-emoji {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    font-size: 24px; background: var(--bg); flex-shrink: 0; transition: background .3s;
  }
  .habit.done .habit-emoji { background: var(--accent-soft); }
  .habit-info { flex: 1; min-width: 0; }
  .habit-name {
    font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .3s;
  }
  .habit.done .habit-name { color: var(--muted); }
  .streak { font-size: 13px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
  .streak.hot { color: var(--flame); font-weight: 600; }
  .streak .num { display: inline-block; }
  .streak .num.bump { animation: bump .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bump { 40% { transform: scale(1.5); } }

  .delete {
    width: 30px; height: 30px; border-radius: 8px; color: var(--muted); font-size: 18px;
    opacity: 0; transition: opacity .15s, background .15s, color .15s;
  }
  .habit:hover .delete, .delete:focus-visible { opacity: 1; }
  .delete:hover { background: var(--bg); color: var(--danger); }
  @media (hover: none) { .delete { opacity: .6; } }
  .delete.confirming {
    opacity: 1; width: auto; padding: 0 10px; font-size: 13px; font-weight: 600;
    background: var(--danger); color: #fff; animation: fill .2s ease-out;
  }
  .delete.confirming:hover { background: var(--danger); color: #fff; }

  /* Big check toggle */
  .check {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; position: relative;
    border: 2.5px solid var(--line); transition: border-color .25s, background .25s, transform .1s;
  }
  .check:hover { border-color: var(--accent); }
  .check:active { transform: scale(.9); }
  .check svg {
    position: absolute; inset: 0; margin: auto; width: 22px; height: 22px;
    stroke: #fff; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s ease .1s;
  }
  .habit.done .check { background: var(--accent); border-color: var(--accent); }
  .habit.done .check svg { stroke-dashoffset: 0; }
  .check.pop { animation: pop .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .check::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid var(--accent); opacity: 0; pointer-events: none;
  }
  .check.pop::after { animation: ripple .6s ease-out; }
  @keyframes ripple { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.8); } }

  /* Weekly view */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .day-label { font-size: 11px; color: var(--muted); font-weight: 500; }
  .day.today .day-label { color: var(--text); font-weight: 700; }
  .dot {
    width: 100%; max-width: 34px; aspect-ratio: 1; border-radius: 10px;
    background: var(--bg); transition: background .25s, transform .15s;
    display: grid; place-items: center; font-size: 12px; color: transparent;
  }
  .dot:hover:not(:disabled) { transform: scale(1.08); }
  .dot.on { background: var(--accent); color: #fff; animation: fill .35s cubic-bezier(.34,1.56,.64,1); }
  .dot:disabled { opacity: .35; cursor: default; }
  .day.today .dot:not(.on) { box-shadow: inset 0 0 0 2px var(--line); }
  @keyframes fill { from { transform: scale(.6); } }

  /* Confetti */
  .particle {
    position: fixed; pointer-events: none; z-index: 10; width: 8px; height: 8px; border-radius: 2px;
    animation: burst .8s cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes burst {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 15px; line-height: 1.6; }
  .empty .big { font-size: 40px; display: block; margin-bottom: 8px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s cubic-bezier(.22,1,.36,1); white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Habits</h1>
      <div class="date" id="today-label"></div>
    </div>
    <div class="ring" title="Today's progress">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle class="track" cx="32" cy="32" r="27"/>
        <circle class="bar" id="ring-bar" cx="32" cy="32" r="27"/>
      </svg>
      <div class="ring-label" id="ring-label">0/0</div>
    </div>
  </header>

  <form class="add" id="add-form" autocomplete="off">
    <button type="button" class="emoji-btn" id="emoji-btn" aria-label="Choose emoji" aria-expanded="false">💧</button>
    <input id="name-input" type="text" placeholder="New habit, e.g. Drink water" maxlength="40" aria-label="Habit name">
    <button type="submit" class="add-submit" id="add-submit" disabled>Add</button>
  </form>
  <div class="picker" id="picker" role="listbox" aria-label="Emoji options"></div>

  <div class="week-nav">
    <button type="button" id="prev-week" aria-label="Previous week">‹</button>
    <span class="label" id="week-label">This week</span>
    <button type="button" id="next-week" aria-label="Next week">›</button>
  </div>

  <div class="list" id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const STORAGE_KEY = 'habit-tracker-v1';
  const EMOJIS = ['💧','🏃','📚','🧘','💪','🥗','😴','✍️','🎸','🚶','🧠','🍎','☀️','🌱','🧹','💊','🦷','📵','🎨','💻','🙏','🚴','🏊','☕'];
  const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const RING_C = 2 * Math.PI * 27;

  // ---------- Dates (local, as YYYY-MM-DD keys) ----------
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const startOfWeek = d => addDays(startOfDay(d), -((d.getDay() + 6) % 7)); // Monday
  const today = () => startOfDay(new Date());

  // ---------- Storage ----------
  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (data && Array.isArray(data.habits)) return data;
    } catch (_) {}
    return { habits: [] };
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (_) { toast('Could not save — storage unavailable'); }
  }

  const state = load();
  let weekOffset = 0;
  let selectedEmoji = EMOJIS[0];

  // ---------- Habit logic ----------
  const isDone = (habit, key) => habit.done.includes(key);

  function toggle(habit, key) {
    const i = habit.done.indexOf(key);
    if (i === -1) habit.done.push(key); else habit.done.splice(i, 1);
    save();
    return i === -1;
  }

  // Consecutive days ending today — or yesterday, so an unfinished today doesn't break the streak.
  function streak(habit) {
    const set = new Set(habit.done);
    let d = today();
    if (!set.has(keyOf(d))) d = addDays(d, -1);
    let count = 0;
    while (set.has(keyOf(d))) { count++; d = addDays(d, -1); }
    return count;
  }

  // ---------- Rendering ----------
  const $ = id => document.getElementById(id);
  const list = $('list');

  function renderHeader() {
    $('today-label').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const total = state.habits.length;
    const done = state.habits.filter(h => isDone(h, keyOf(today()))).length;
    $('ring-label').textContent = `${done}/${total}`;
    const bar = $('ring-bar');
    bar.style.strokeDasharray = RING_C;
    bar.style.strokeDashoffset = RING_C * (1 - (total ? done / total : 0));
  }

  function renderWeekNav() {
    const start = addDays(startOfWeek(today()), weekOffset * 7);
    const end = addDays(start, 6);
    const fmt = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    $('week-label').textContent =
      weekOffset === 0 ? 'This week' : weekOffset === -1 ? 'Last week' : `${fmt(start)} – ${fmt(end)}`;
    $('next-week').disabled = weekOffset >= 0;
  }

  function streakHTML(n) {
    if (n === 0) return 'No streak yet';
    return `<span>🔥</span><span class="num">${n}</span>-day streak`;
  }

  function habitEl(habit) {
    const todayKey = keyOf(today());
    const el = document.createElement('div');
    el.className = 'habit' + (isDone(habit, todayKey) ? ' done' : '');
    el.dataset.id = habit.id;

    const n = streak(habit);
    el.innerHTML = `
      <div class="habit-top">
        <div class="habit-emoji"></div>
        <div class="habit-info">
          <div class="habit-name"></div>
          <div class="streak${n >= 3 ? ' hot' : ''}">${streakHTML(n)}</div>
        </div>
        <button class="delete" aria-label="Delete habit" title="Delete">×</button>
        <button class="check" aria-label="Mark complete for today" aria-pressed="${isDone(habit, todayKey)}">
          <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </button>
      </div>
      <div class="week"></div>`;
    el.querySelector('.habit-emoji').textContent = habit.emoji;
    el.querySelector('.habit-name').textContent = habit.name;
    el.querySelector('.habit-name').title = habit.name;

    const week = el.querySelector('.week');
    const start = addDays(startOfWeek(today()), weekOffset * 7);
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, i);
      const key = keyOf(d);
      const future = d > today();
      const day = document.createElement('div');
      day.className = 'day' + (key === todayKey ? ' today' : '');
      day.innerHTML = `<span class="day-label">${DAY_NAMES[i]}</span>
        <button class="dot${isDone(habit, key) ? ' on' : ''}" data-key="${key}" ${future ? 'disabled' : ''}
          aria-label="${d.toDateString()}" aria-pressed="${isDone(habit, key)}">✓</button>`;
      week.appendChild(day);
    }
    return el;
  }

  function render() {
    renderHeader();
    renderWeekNav();
    list.innerHTML = '';
    if (!state.habits.length) {
      list.innerHTML = `<div class="empty"><span class="big">🌱</span>No habits yet.<br>Add one above to start building a streak.</div>`;
      return;
    }
    state.habits.forEach(h => list.appendChild(habitEl(h)));
  }

  // Update one card in place so animations play on the existing elements.
  function refreshCard(habit, el, { bump = false } = {}) {
    const todayKey = keyOf(today());
    const doneToday = isDone(habit, todayKey);
    el.classList.toggle('done', doneToday);
    el.querySelector('.check').setAttribute('aria-pressed', doneToday);
    const n = streak(habit);
    const s = el.querySelector('.streak');
    s.className = 'streak' + (n >= 3 ? ' hot' : '');
    s.innerHTML = streakHTML(n);
    if (bump && n > 0) s.querySelector('.num').classList.add('bump');
    el.querySelectorAll('.dot').forEach(dot => {
      const on = isDone(habit, dot.dataset.key);
      dot.classList.toggle('on', on);
      dot.setAttribute('aria-pressed', on);
    });
    renderHeader();
  }

  // ---------- Effects ----------
  function confetti(target) {
    const r = target.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const colors = ['#2fb67c', '#ffcf3d', '#ff8a3d', '#5b8cff', '#ff6fb5'];
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * 50;
      p.style.left = cx - 4 + 'px';
      p.style.top = cy - 4 + 'px';
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      p.style.setProperty('--rot', Math.random() * 360 + 'deg');
      if (Math.random() > .5) p.style.borderRadius = '50%';
      document.body.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
    }
  }

  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth; // reflow so the animation replays
    el.classList.add(cls);
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- Events ----------
  list.addEventListener('click', e => {
    const card = e.target.closest('.habit');
    if (!card) return;
    const habit = state.habits.find(h => h.id === card.dataset.id);
    if (!habit) return;

    if (e.target.closest('.check')) {
      const btn = e.target.closest('.check');
      const nowDone = toggle(habit, keyOf(today()));
      refreshCard(habit, card, { bump: nowDone });
      if (nowDone) {
        restart(btn, 'pop');
        confetti(btn);
        const allDone = state.habits.every(h => isDone(h, keyOf(today())));
        if (allDone && state.habits.length > 1) toast('🎉 All habits done today!');
      }
    } else if (e.target.closest('.dot')) {
      const dot = e.target.closest('.dot');
      if (dot.disabled) return;
      const nowDone = toggle(habit, dot.dataset.key);
      refreshCard(habit, card, { bump: nowDone });
      if (nowDone && dot.dataset.key === keyOf(today())) restart(card.querySelector('.check'), 'pop');
    } else if (e.target.closest('.delete')) {
      // Two taps to delete: the first arms the button, the second within 3s confirms.
      const del = e.target.closest('.delete');
      if (!del.classList.contains('confirming')) {
        del.classList.add('confirming');
        del.textContent = 'Delete?';
        del.setAttribute('aria-label', `Tap again to delete ${habit.name} and its history`);
        clearTimeout(del._reset);
        del._reset = setTimeout(() => {
          del.classList.remove('confirming');
          del.textContent = '×';
          del.setAttribute('aria-label', 'Delete habit');
        }, 3000);
        return;
      }
      clearTimeout(del._reset);
      state.habits = state.habits.filter(h => h !== habit);
      save();
      card.classList.add('removing');
      card.addEventListener('transitionend', render, { once: true });
    }
  });

  const form = $('add-form'), input = $('name-input'), submit = $('add-submit');
  const emojiBtn = $('emoji-btn'), picker = $('picker');

  input.addEventListener('input', () => { submit.disabled = !input.value.trim(); });

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) return;
    state.habits.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name,
      emoji: selectedEmoji,
      created: keyOf(today()),
      done: []
    });
    save();
    input.value = '';
    submit.disabled = true;
    closePicker();
    render();
    // Rotate to a fresh emoji suggestion for the next habit.
    setEmoji(EMOJIS[(EMOJIS.indexOf(selectedEmoji) + 1) % EMOJIS.length]);
  });

  function setEmoji(em) { selectedEmoji = em; emojiBtn.textContent = em; }
  function closePicker() { picker.classList.remove('open'); emojiBtn.setAttribute('aria-expanded', 'false'); }

  picker.innerHTML = EMOJIS.map(em => `<button type="button" role="option">${em}</button>`).join('') +
    `<label class="custom">Or type your own: <input id="custom-emoji" type="text" maxlength="8" aria-label="Custom emoji"></label>`;

  emojiBtn.addEventListener('click', () => {
    const open = picker.classList.toggle('open');
    emojiBtn.setAttribute('aria-expanded', open);
  });
  picker.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    setEmoji(b.textContent);
    closePicker();
    input.focus();
  });
  $('custom-emoji').addEventListener('input', e => {
    // Keep only the first grapheme (handles multi-codepoint emoji where supported).
    const v = e.target.value.trim();
    if (!v) return;
    const first = window.Intl && Intl.Segmenter
      ? [...new Intl.Segmenter().segment(v)][0].segment
      : Array.from(v)[0];
    setEmoji(first);
  });
  $('custom-emoji').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); e.target.value = ''; closePicker(); input.focus(); }
  });
  document.addEventListener('click', e => {
    if (!picker.contains(e.target) && e.target !== emojiBtn) closePicker();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });

  $('prev-week').addEventListener('click', () => { weekOffset--; render(); });
  $('next-week').addEventListener('click', () => { if (weekOffset < 0) { weekOffset++; render(); } });

  // Re-render when the day rolls over or the tab regains focus on a new day.
  let lastDay = keyOf(today());
  function checkDayChange() {
    const k = keyOf(today());
    if (k !== lastDay) { lastDay = k; render(); }
  }
  document.addEventListener('visibilitychange', checkDayChange);
  setInterval(checkDayChange, 60 * 1000);

  render();
})();
</script>
</body>
</html>
